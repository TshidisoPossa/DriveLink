<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DriveLink | Create your account</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="Register.css">
</head>
<body>
<div class="register-container">
  <div class="register-card">
    <div class="page-header">
      <h1>CREATE YOUR ACCOUNT</h1>
      <p>Start your journey with DriveLink today. It only takes a few minutes.</p>
    </div>

    <!-- ADDED enctype="multipart/form-data" FOR FILE UPLOAD -->
    <form id="registrationForm" action="Register.php" method="post" enctype="multipart/form-data">
      
      <!-- 1. PERSONAL INFORMATION -->
      <div class="form-section">
        <div class="section-title">
          <span>1</span> PERSONAL INFORMATION
        </div>
        <div class="form-grid-2">
          <div class="input-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" value="" required>
          </div>
          <div class="input-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" value="" required>
          </div>
          <div class="input-group full-width">
            <label>Gender</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="gender" value="Male"> Male
              </label>
              <label class="radio-option">
                <input type="radio" name="gender" value="Female"> Female
              </label>
              <label class="radio-option">
                <input type="radio" name="gender" value="Non-binary"> Non-binary
              </label>
            </div>
          </div>
        </div>
      </div>

      <!--  CONTACT DETAILS -->
      <div class="form-section">
        <div class="section-title">
          <span>2</span> CONTACT DETAILS
        </div>
        <div class="form-grid-2">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="" required>
          </div>
          <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" value="" required>
          </div>
          <div class="input-group full-width">
            <label for="address">Residential Address</label>
            <input type="text" id="address" name="address" value="" required>
          </div>
        </div>
      </div>

      <!--  PROFILE & VERIFICATION -->
      <div class="form-section">
        <div class="section-title">
          <span>3</span> PROFILE & VERIFICATION
        </div>
        <div class="verification-row">
          <!-- Profile Photo Upload -->
          <div class="input-group">
            <label for="profilePhoto">Profile Photo <span class="optional">(optional)</span></label>
            <div class="file-upload-area">
              <div class="file-input-custom">
                <input type="file" id="profilePhoto" name="profilePhoto" accept="image/png, image/jpeg, image/jpg, image/heic">
                <span class="file-hint">JPG, PNG up to 5MB</span>
              </div>
            </div>
            <span class="sample-badge">Recommended: square image, max 2MB</span>
          </div>

          <!-- Sub ID / Passport field -->
          <div class="input-group">
            <label for="subIdPassport">Sub ID / Passport Number</label>
            <input type="text" id="subIdPassport" name="subIdPassport" placeholder="e.g., A12 345 6789 or passport ID" value="">
            <span class="sample-badge">Government ID or passport reference</span>
          </div>
        </div>
      </div>

      <!--  LOGIN CREDENTIALS (NEW SECTION) -->
      <div class="form-section">
        <div class="section-title">
          <span>4</span> LOGIN CREDENTIALS
        </div>
        <div class="form-grid-2">
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
          </div>
        </div>
      </div>

      <!-- REGISTER BUTTON -->
      <div class="button-container">
        <button type="submit" class="btn-register">
          ✨  Create account
        </button>
      </div>
    </form>
  </div>
</div>


<script>
  const form = document.getElementById('registrationForm');
  const password = document.getElementById('password');
  const confirm = document.getElementById('confirmPassword');

  form.addEventListener('submit', function(e) {
    if (password.value !== confirm.value) {
      e.preventDefault();
      alert('Passwords do not match. Please try again.');
      confirm.focus();
    }
  });
</script>
</body>
</html>
