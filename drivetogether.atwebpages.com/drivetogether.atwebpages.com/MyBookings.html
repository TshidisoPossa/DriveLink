<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriveLink – My Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="RenterDashboard.css">
  <style>
    .booking-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .booking-left h3 {
      margin: 0 0 4px;
      font-size: 1.1rem;
      color: #111827;
    }
    .booking-left p {
      margin: 2px 0;
      color: #6b7280;
      font-size: 0.85rem;
    }
    .booking-ref {
      font-weight: 700;
      color: #1a56db;
    }
    .booking-right {
      text-align: right;
    }
    .booking-total {
      font-size: 1.2rem;
      font-weight: 800;
      color: #111827;
    }
    .booking-status {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background: #dcfce7;
      color: #16a34a;
    }
    .booking-status.pending {
      background: #fef9c3;
      color: #ca8a04;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }
    .empty-state a {
      color: #1a56db;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- ══ NAVBAR ══ -->
  <nav class="navbar">
    <div class="nav-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white" width="18" height="18">
          <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
        </svg>
      </div>
      <span class="logo-name">DRIVE<span>LINK</span></span>
    </div>

    <ul class="nav-links">
      <li><a href="RenterDashboard.html">Home</a></li>
      <li><a href="RenterDashboard.html">Browse Cars</a></li>
      <li><a href="#">How It Works</a></li>
    </ul>

    <div class="nav-profile">
      <div class="avatar">T</div>
      <span class="greeting">Hi, Tshidiso</span>
    </div>
  </nav>

  <!-- ══ LAYOUT ══ -->
  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-profile">
        <div class="sidebar-avatar">T</div>
        <div>
          <div class="sidebar-name">Tshidiso M.</div>
          <div class="sidebar-badge"><span class="badge-dot"></span>Verified</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="RenterDashboard.html" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Browse Cars
        </a>
        <a href="MyBookings.html" class="sidebar-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          My Bookings
        </a>
        <a href="#" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17H5v-5l2.5-6h9L19 12v5z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>
          My Listings
        </a>
        <div class="sidebar-divider"></div>
        <a href="#" class="sidebar-link logout-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <div class="welcome-banner">
        <div>
          <p class="welcome-label">Your trips 🚗</p>
          <h1 class="welcome-title">My <span>Bookings</span></h1>
          <p class="welcome-sub">All your confirmed and past rentals in one place.</p>
        </div>
      </div>

      <div id="bookingsList" style="margin-top: 24px;">
        <p style="color:#6b7280;">Loading your bookings…</p>
      </div>

    </main>
  </div>

  <script>
    function formatRand(n) {
      return 'R ' + Number(n).toLocaleString('en-ZA', { minimumFractionDigits: 2 });
    }

    function formatDate(str) {
      if (!str) return '—';
      const d = new Date(str);
      if (isNaN(d)) return str;
      return d.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    fetch('get_bookings.php')
      .then(res => res.json())
      .then(bookings => {
        const list = document.getElementById('bookingsList');

        if (!Array.isArray(bookings) || bookings.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <p>You don't have any bookings yet.</p>
              <a href="RenterDashboard.html">Browse cars to get started →</a>
            </div>
          `;
          return;
        }

        list.innerHTML = bookings.map(b => `
          <div class="booking-card">
            <div class="booking-left">
              <h3>${b.car_name || 'Vehicle'}</h3>
              <p class="booking-ref">#${b.booking_ref || '—'}</p>
              <p>📍 Host: ${b.host_name || '—'}</p>
              <p>🗓 ${formatDate(b.pickup_date)} → ${formatDate(b.return_date)} (${b.days} day${b.days !== 1 ? 's' : ''})</p>
            </div>
            <div class="booking-right">
              <div class="booking-total">${formatRand(b.total_amount)}</div>
              <span class="booking-status ${b.payment_status === 'paid' ? '' : 'pending'}">
                ${b.payment_status === 'paid' ? 'Paid' : 'Pending'}
              </span>
            </div>
          </div>
        `).join('');
      })
      .catch(err => {
        console.error(err);
        document.getElementById('bookingsList').innerHTML =
          '<p style="color:#dc2626;">Could not load bookings. Please try again later.</p>';
      });
  </script>

</body>
</html>
