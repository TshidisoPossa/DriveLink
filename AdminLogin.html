<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DriveLink - Admin Login</title>
  <link rel="stylesheet" href="AdmimLog.css">
  <script src="adminLog.js" defer></script>
</head>
<body>
  <div class="login-card">
    <div class="brand"><span>DriveLink</span> Admin</div>
    <div class="subtitle">Secure administrator access</div>

    <div id="error-box" class="error"></div>

    <form action="admin_login.php" method="post" id="adminLoginForm">
      <label for="username">Admin email</label>
      <input type="text" id="username" name="username" placeholder="" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="" required>

      <button type="submit" class="btn-primary">Login</button>
    </form>

    <!-- Button that redirects to AdminHome.html -->
    <button class="btn-secondary" type="button" id="goAdminHomeBtn">
      Go to Admin Home
    </button>
  </div>
</body>
</html>
